function rebuild() {
  var out = BASE_SESSIONS.map(function (s) {

  out.sort(function (a, b) { return (a.date + a.slot) < (b.date + b.slot) ? -1 : 1; });

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.attendance)); } catch (e) {}
}

function queueCloudSync() {
  syncStatus = "syncing";
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 700);
  renderSyncBadge();
}

function pushToCloud() {
  fetch(SYNC.base + SYNC.binId, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Access-Key": SYNC.accessKey },
    body: JSON.stringify({ attendance: state.attendance, moves: state.moves, custom: state.custom, updatedAt: new Date().toISOString() })
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        console.error("[sync] push failed:", res.status, body);
        var err = new Error("http_" + res.status);
        err.status = res.status;
        throw err;
      });
    }
    syncStatus = "synced";
    renderSyncBadge();
  }).catch(function (e) {
    console.error("[sync] push error:", e);
    if (e && (e.status === 401 || e.status === 403)) syncStatus = "auth_error";
    else if (e && e.status === 404) syncStatus = "not_found";
    else syncStatus = "error";
    renderSyncBadge();
  });
}

function pullFromCloud(showLoading) {
  if (showLoading) { syncStatus = "syncing"; renderSyncBadge(); }
  fetch(SYNC.base + SYNC.binId + "/latest", {
    headers: { "X-Access-Key": SYNC.accessKey }
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        console.error("[sync] pull failed:", res.status, body);
        var err = new Error("http_" + res.status);
        err.status = res.status;
        throw err;
      });
    }
    return res.json();
  }).then(function (data) {
    var record = data && data.record ? data.record : null;
    if (record && record.attendance) {
      state.attendance = record.attendance;
      if (record.moves || record.custom) { state.moves = record.moves || {}; state.custom = record.custom || []; rebuild(); persistSchedule(); }
      persist();
      render();
    }
    syncStatus = "synced";
    renderSyncBadge();
  }).catch(function (e) {
    console.error("[sync] pull error:", e);
    if (e && (e.status === 401 || e.status === 403)) syncStatus = "auth_error";
    else if (e && e.status === 404) syncStatus = "not_found";
    else syncStatus = "offline";
    renderSyncBadge();
  });
}

function renderSyncBadge() {
  var el = document.getElementById("syncBadge");
  if (!el) return;
  var map = {
    idle:       { text: "\\u00b7", color: "#9AA3C0" },
    syncing:    { text: "Syncing\\u2026", color: "#6B7494" },
    synced:     { text: "Synced", color: "#16A34A" },
    error:      { text: "Sync failed \\u2013 saved on this device", color: "#E11D48" },
    offline:    { text: "Offline \\u2013 showing last saved copy", color: "#E11D48" },
    auth_error: { text: "Sync key rejected \\u2013 check Access Key permissions", color: "#E11D48" },
    not_found:  { text: "Bin not found \\u2013 check Bin ID", color: "#E11D48" }
  };
  var m = map[syncStatus] || map.idle;
  el.textContent = m.text;
  el.style.color = m.color;
}

/* ---------- derived stats ---------- */
function computeCourseStats(today) {
  var stats = {};
  COURSES.forEach(function (c) {
    var sessions = SESSIONS.filter(function (s) { return s.subject === c; });
    var present = 0, od = 0, absent = 0, cancelled = 0, unmarkedPast = 0;
    sessions.forEach(function (s) {
      var st = state.attendance[s.id];
      if (st === "present") present++;
      else if (st === "od") od++;
      else if (st === "absent") absent++;
      else if (st === "cancelled") cancelled++;
      else if (s.date < today) unmarkedPast++;
    });
    var held = present + od + absent;
    var pct = held > 0 ? ((present + od) / held) * 100 : null;
    stats[c] = { total: sessions.length, present: present, od: od, absent: absent, cancelled: cancelled, unmarkedPast: unmarkedPast, held: held, pct: pct };
  });
  return stats;
}

function computeOverall(today) {
  var present = 0, od = 0, absent = 0, unmarkedPast = 0, total = SESSIONS.length;
  SESSIONS.forEach(function (s) {
    var st = state.attendance[s.id];
    if (st === "present") present++;
    else if (st === "od") od++;
    else if (st === "absent") absent++;
    else if (!st && s.date < today) unmarkedPast++;
  });
  var held = present + od + absent;
  var pct = held > 0 ? ((present + od) / held) * 100 : null;
  return { present: present, od: od, absent: absent, held: held, pct: pct, total: total, unmarkedPast: unmarkedPast };
}

function groupByMonth(filterCourse) {
  var filtered = filterCourse === "all" ? SESSIONS : SESSIONS.filter(function (s) { return s.subject === filterCourse; });
  var groups = {}, order = [];
  filtered.forEach(function (s) {
    var key = s.date.slice(0, 7);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  order.sort();
  return order.map(function (k) { return [k, groups[k]]; });
}

function statsHtml(today, overall, cs) {
  function dd(iso) { return new Date(iso + "T00:00:00"); }

  function until(r) {

  var elapsed = SESSIONS.filter(function (s) { return s.date < today; }).length;
  var skips = 0, perfect = 0;

  var ranked = COURSES.filter(function (c) { return cs[c].held > 0; }).sort(function (a, b) { return cs[b].pct - cs[a].pct; });
  var top = ranked[0], low = ranked[ranked.length - 1];
  var perDay = {};

  var md = Object.keys(perDay).sort(function (a, b) { return perDay[b] - perDay[a] || (a < b ? -1 : 1); })[0];
  var none = "Mark a few classes first";
  var h = '<div style="background:#F8F9FD;border:1px solid #E3E6F0;border-radius:12px;padding:14px 16px;margin-bottom:12px;">' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#6B7494;"><span>Term progress</span><span>' +
    elapsed + ' / ' + SESSIONS.length + ' classes gone by</span></div>' +
    '<div style="height:10px;background:#E9ECF5;border-radius:5px;margin-top:8px;overflow:hidden;"><div style="height:100%;width:' +
    Math.round(elapsed / SESSIONS.length * 100) + '%;background:#7C5CFF;"></div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px;">';
  h += tile("Current streak", run, "classes in a row \u00b7 best " + longest, run >= 5 ? "#16A34A" : null);
  h += tile("Hours in class", (attended * 1.5).toFixed(1) + "h", attended + " classes attended");
  h += tile("Skip budget left", skips, "across all courses at " + STUDENT.threshold + "%", skips === 0 ? "#E11D48" : null);
  h += tile("Classes to go", left, (left * 1.5).toFixed(1) + " hours of lectures");
  h += tile("Marathon day", perDay[md] + " classes", fmtDate(md) + " \u00b7 " + new Date(md + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long" }));
  h += tile("Perfect courses", perfect, "zero absences so far", perfect > 0 ? "#16A34A" : null);
  h += tile("Star course", top ? Math.round(cs[top].pct) + "%" : "\u2014", top ? esc(top) : none, "#16A34A");
  h += tile("Needs some love", low ? Math.round(cs[low].pct) + "%" : "\u2014", low ? esc(low) : none, low && cs[low].pct < STUDENT.threshold ? "#E11D48" : null);
  h += tile("Mid sems in", until(EXAMS.mid), fmtDate(EXAMS.mid[0]) + " \u2013 " + fmtDate(EXAMS.mid[1]));
  h += tile("End sems in", until(EXAMS.end), fmtDate(EXAMS.end[0]) + " \u2013 " + fmtDate(EXAMS.end[1]));
  return h + '</div>';
}

function render() {
  captureForm();
  var today = todayStr();
  var overall = computeOverall(today);
  var courseStats = computeCourseStats(today);

  var html = '';

  // masthead
  html += '<div style="border-bottom:1px solid #E3E6F0;padding:28px 20px 22px;background:radial-gradient(120% 140% at 10% 0%,#EEEAFF 0%,#FFFFFF 70%);">';
  html += '<div style="max-width:880px;margin:0 auto;">';
  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' + iconScroll(20, "#7C5CFF") +
    '<span class="mono" style="font-size:11px;letter-spacing:0.15em;color:#7C5CFF;font-weight:600;">REGISTER No. ' + esc(STUDENT.reg) + '</span></div>';
  html += '<h1 class="serif" style="font-weight:700;font-size:clamp(28px,5vw,40px);margin:0;color:#1B2033;letter-spacing:-0.01em;">' + greet() + ', Anubhav</h1>';
  html += '<p style="margin:6px 0 0;font-size:14px;color:#4B5471;">' + esc(STUDENT.name) + ' &nbsp;\u00b7&nbsp; ' + esc(STUDENT.program) +
    ' &nbsp;\u00b7&nbsp; ' + fmtDate(SESSIONS[0].date) + ' \u2013 ' + fmtDate(SESSIONS[SESSIONS.length - 1].date) + '</p>';
  html += '</div></div>';

  html += '<div style="max-width:880px;margin:0 auto;padding:0 20px;">';

  // overall summary bar
  html += '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#F8F9FD;border:1px solid #E3E6F0;border-radius:10px;padding:16px 20px;margin:20px 0;box-shadow:0 1px 2px rgba(0,0,0,0.03);">';
  html += sealHtml(overall.pct, 72);
  html += '<div style="flex:1;min-width:180px;">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">';
  html += '<span style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:#6B7494;">' + rankLabel(overall.pct) + '</span>';
  html += '<span style="display:flex;align-items:center;gap:8px;">' +
    '<span id="syncBadge" class="mono" style="font-size:10.5px;"></span>' +
    '<button class="att-btn" id="refreshBtn" title="Pull latest from other devices" style="border:1px solid #CDD3E6;background:#F8F9FD;border-radius:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;">' + iconReset(12, "#6B7494") + '</button></span>';
  html += '</div>';
  html += '<div class="mono" style="font-size:14px;">' + overall.present + ' present \u00b7 ' + overall.od + ' OD \u00b7 ' + overall.absent +
    ' absent \u00b7 ' + overall.held + ' of ' + overall.total + ' classes held so far</div>';
  if (overall.unmarkedPast > 0) {
    html += '<div style="font-size:12.5px;color:#E11D48;margin-top:4px;">' + overall.unmarkedPast + ' past class' + (overall.unmarkedPast > 1 ? "es" : "") + ' still need marking</div>';
  }
  html += '</div></div>';

  html += todayHtml(today);

  // tabs
  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">';
  [["overview", "Overview", iconCap], ["register", "Register", iconScroll], ["stats", "Fun Stats", iconStar]].forEach(function (t) {
    var active = state.view === t[0];
    html += '<button class="att-btn" data-view="' + t[0] + '" style="display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;' +
      'border:1px solid ' + (active ? "#7C5CFF" : "#CDD3E6") + ';background:' + (active ? "#7C5CFF" : "#F8F9FD") +
      ';color:' + (active ? "#FFFFFF" : "#4B5471") + ';font-size:13.5px;font-weight:600;">' + t[2](15, active ? "#FFFFFF" : "#4B5471") + ' ' + t[1] + '</button>';
  });
  html += '<button class="att-btn" id="addBtn" style="padding:9px 14px;border-radius:8px;border:1px solid #7C5CFF;background:#fff;color:#7C5CFF;font-size:13.5px;font-weight:600;">+ Add class</button>';
  html += '<button class="att-btn" id="resetBtn" style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;' +
    'border:1px solid #CDD3E6;background:#F8F9FD;color:#6B7494;font-size:13px;">' + iconReset(14, "#6B7494") + ' Reset</button>';
  html += '</div>';

  if (state.showResetConfirm) {
    html += '<div style="background:#FFF1F2;border:1px solid #FDA4AF;border-radius:8px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">';
    html += '<span style="font-size:13.5px;color:#7C5CFF;">Clear every marked attendance record? This can\'t be undone.</span>';
    html += '<div style="display:flex;gap:8px;">';
    html += '<button class="att-btn" id="confirmResetBtn" style="padding:6px 14px;border-radius:6px;border:none;background:#E11D48;color:#fff;font-size:13px;font-weight:600;">Yes, clear all</button>';
    html += '<button class="att-btn" id="cancelResetBtn" style="padding:6px 14px;border-radius:6px;border:1px solid #CDD3E6;background:#F8F9FD;font-size:13px;">Cancel</button>';
    html += '</div></div>';
  }

  if (state.view === "overview") {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px;">';
    COURSES.forEach(function (c) {
      var s = courseStats[c];
      html += '<div class="rise" style="background:#F8F9FD;border:1px solid #E3E6F0;border-left:4px solid ' + courseColor(c) + ';border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;">';
      html += sealHtml(s.pct, 64);
      html += '<div style="flex:1;min-width:0;">';
      html += '<div class="serif" style="font-weight:600;font-size:15px;line-height:1.3;margin-bottom:3px;">' + esc(c) + '</div>';
      html += '<div style="font-size:12px;color:#6B7494;margin-bottom:8px;">' + esc(PROF_BY_COURSE[c]) + '</div>';
      html += '<div class="mono" style="font-size:12px;color:#4B5471;">' + s.present + 'P' + (s.od ? ' \u00b7 ' + s.od + 'OD' : '') +
        ' \u00b7 ' + s.absent + 'A' + (s.cancelled ? ' \u00b7 ' + s.cancelled + 'C' : '') + ' &nbsp;/&nbsp; ' + s.total + ' total</div>';
      html += bunkHtml(s);
      if (s.unmarkedPast > 0) html += '<div style="font-size:11.5px;color:#E11D48;margin-top:4px;">' + s.unmarkedPast + ' unmarked</div>';
      html += '</div></div>';
    });
    html += '</div>';
  }

  if (state.view === "register") {
    html += '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;">';
    var allActive = state.courseFilter === "all";
    html += '<button class="att-btn course-chip" data-course="all" style="padding:6px 13px;border-radius:20px;border:1px solid ' + (allActive ? "#7C5CFF" : "#CDD3E6") +
      ';background:' + (allActive ? "#7C5CFF" : "#F8F9FD") + ';color:' + (allActive ? "#FFFFFF" : "#4B5471") + ';font-size:12.5px;white-space:nowrap;font-weight:600;">All courses</button>';
    COURSES.forEach(function (c) {
      var active = state.courseFilter === c;
      html += '<button class="att-btn course-chip" data-course="' + esc(c) + '" style="padding:6px 13px;border-radius:20px;border:1px solid ' + (active ? "#7C5CFF" : "#CDD3E6") +
        ';background:' + (active ? "#7C5CFF" : "#F8F9FD") + ';color:' + (active ? "#FFFFFF" : "#4B5471") + ';font-size:12.5px;white-space:nowrap;font-weight:600;">' + esc(c) + '</button>';
    });
    html += '</div>';

    var groups = groupByMonth(state.courseFilter);
    groups.forEach(function (g) {
      var monthKey = g[0], sess = g[1];
      var isOpen = !!state.openMonths[monthKey];
      html += '<div style="margin-bottom:12px;border:1px solid #E3E6F0;border-radius:10px;background:#F8F9FD;overflow:hidden;">';
      html += '<button class="att-btn month-toggle" data-month="' + monthKey + '" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:transparent;border:none;text-align:left;">';
      html += '<span class="serif" style="font-weight:600;font-size:15px;">' + fmtMonthYear(sess[0].date) + '</span>';
      html += '<span style="display:flex;align-items:center;gap:8px;color:#6B7494;font-size:12px;">' + sess.length + ' session' + (sess.length > 1 ? "s" : "") + ' ' +
        (isOpen ? iconChevUp(16, "#6B7494") : iconChevDown(16, "#6B7494")) + '</span>';
      html += '</button>';
      if (isOpen) {
        html += '<div style="border-top:1px solid #E9ECF5;">';
        sess.forEach(function (s) {
          var st = state.attendance[s.id];
          var isToday = s.date === today;
          html += '<div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #F0F2F8;background:' + (isToday ? "#EEF2FF" : "transparent") + ';">';
          html += '<div style="width:92px;flex-shrink:0;"><div class="mono" style="font-size:12.5px;font-weight:600;">' + fmtDate(s.date) + '</div>' +
            '<div style="font-size:10.5px;color:#6B7494;">' + s.day.slice(0, 3) + ' \u00b7 ' + s.slot + '</div></div>';
          html += '<div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:' + courseColor(s.subject) + ';"></span>' + esc(s.subject) + ' <span class="mono" style="font-size:11px;color:#6B7494;">' + tag(s) + '</span></div>' +
            '<div style="font-size:11.5px;color:#6B7494;">' + esc(s.professor) + (s.professor ? ' \u00b7 ' : '') + '<button class="edit-btn" data-id="' + s.id + '" style="background:none;border:none;padding:4px 0;color:#7C5CFF;font-weight:600;font-size:11.5px;cursor:pointer;">' + (s.custom ? 'Edit' : 'Reschedule') + '</button></div></div>';
          html += '<div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:132px;">';
          STATUS_ORDER.forEach(function (opt) {
            var meta = STATUS_META[opt];
            var active = st === opt;
            html += '<button class="att-btn mark-btn" data-id="' + s.id + '" data-status="' + opt + '" title="' + meta.label + '" style="width:28px;height:28px;border-radius:7px;' +
              'border:1.5px solid ' + (active ? meta.color : "#CDD3E6") + ';background:' + (active ? meta.color : "#F8F9FD") +
              ';display:flex;align-items:center;justify-content:center;">' + meta.glyph(13, active ? "#fff" : "#6B7494") + '</button>';
          });
          html += '</div></div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
  }

  if (state.view === "stats") html += statsHtml(today, overall, courseStats);

  // legend + footer
  html += '<div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:11.5px;color:#6B7494;">';
  STATUS_ORDER.forEach(function (opt) {
    var meta = STATUS_META[opt];
    html += '<span style="display:flex;align-items:center;gap:5px;">' + meta.glyph(12, meta.color) + ' ' + meta.label + '</span>';
  });
  html += '</div>';
  html += '<div class="mono" style="text-align:center;font-size:11.5px;color:#9AA3C0;margin-top:10px;">' +
    STUDENT.threshold + '% minimum attendance \u00b7 On Duty counts as present \u00b7 marks saved automatically on this device</div>';

  html += '</div>'; // max-width wrapper

  html += modalHtml();
  document.getElementById("root").innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  var root = document.getElementById("root");
  root.querySelectorAll("[data-view]").forEach(function (btn) {
    btn.addEventListener("click", function () { state.view = btn.getAttribute("data-view"); render(); });
  });
  var resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", function () { state.showResetConfirm = true; render(); });
  var refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.addEventListener("click", function () { pullFromCloud(true); });
  attachScheduleHandlers(root);
  renderSyncBadge();
  var confirmResetBtn = document.getElementById("confirmResetBtn");
  if (confirmResetBtn) confirmResetBtn.addEventListener("click", resetAll);
  var cancelResetBtn = document.getElementById("cancelResetBtn");
  if (cancelResetBtn) cancelResetBtn.addEventListener("click", function () { state.showResetConfirm = false; render(); });
  root.querySelectorAll(".course-chip").forEach(function (btn) {
    btn.addEventListener("click", function () { state.courseFilter = btn.getAttribute("data-course"); render(); });
  });
  root.querySelectorAll(".month-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var k = btn.getAttribute("data-month");
      state.openMonths[k] = !state.openMonths[k];
      render();
    });
  });
  root.querySelectorAll(".mark-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      mark(btn.getAttribute("data-id"), btn.getAttribute("data-status"));
    });
  });
}

rebuild();
// default-open current month
state.openMonths[todayStr().slice(0, 7)] = true;

render(); // fast paint from local cache
pullFromCloud(true); // then reconcile with the cloud copy

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") pullFromCloud(false);
});
window.addEventListener("focus", function () { pullFromCloud(false); });
})();
</script>
</body>
</html>
