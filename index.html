10:45-12:15","subject":"Story Telling with Data","professor":"Prof. Madan Lal Yadav","id":"2026-10-13_10:45-12:15"},{"date":"2026-10-13","day":"Tuesday","slot":"13:15-14:45","subject":"Search Engine Optimization","professor":"Prof. Amresh Kumar","id":"2026-10-13_13:15-14:45"},{"date":"2026-10-14","day":"Wednesday","slot":"09:00-10:30","subject":"Investment and Portfolio Management","professor":"Prof. Sabyasachi Mohapatra","id":"2026-10-14_09:00-10:30"},{"date":"2026-10-14","day":"Wednesday","slot":"13:15-14:45","subject":"Supply Chain Analytics","professor":"Prof. Shashank Kumar","id":"2026-10-14_13:15-14:45"},{"date":"2026-10-15","day":"Thursday","slot":"09:00-10:30","subject":"Artificial Intelligence and Machine Learning in Digital Business Management","professor":"Prof. Samant Saurabh","id":"2026-10-15_09:00-10:30"},{"date":"2026-10-15","day":"Thursday","slot":"10:45-12:15","subject":"Digital Business Consulting","professor":"Prof. Amit Kumar Srivastava","id":"2026-10-15_10:45-12:15"},{"date":"2026-10-15","day":"Thursday","slot":"13:15-14:45","subject":"Search Engine Optimization","professor":"Prof. Amresh Kumar","id":"2026-10-15_13:15-14:45"},{"date":"2026-10-16","day":"Friday","slot":"09:00-10:30","subject":"Investment and Portfolio Management","professor":"Prof. Sabyasachi Mohapatra","id":"2026-10-16_09:00-10:30"},{"date":"2026-10-21","day":"Wednesday","slot":"09:00-10:30","subject":"Search Engine Optimization","professor":"Prof. Amresh Kumar","id":"2026-10-21_09:00-10:30"},{"date":"2026-10-21","day":"Wednesday","slot":"10:45-12:15","subject":"Artificial Intelligence and Machine Learning in Digital Business Management","professor":"Prof. Samant Saurabh","id":"2026-10-21_10:45-12:15"},{"date":"2026-10-21","day":"Wednesday","slot":"13:15-14:45","subject":"Supply Chain Analytics","professor":"Prof. Shashank Kumar","id":"2026-10-21_13:15-14:45"},{"date":"2026-10-21","day":"Wednesday","slot":"15:00-16:30","subject":"Story Telling with Data","professor":"Prof. Madan Lal Yadav","id":"2026-10-21_15:00-16:30"}];

const STUDENT = { name: "Anubhav Prasad", reg: "DBM/1007/03", program: "DBM Term IV", threshold: 80 };

const STATUS_META = {
  present: { label: "Present", color: "#3F6B4C" },
  od: { label: "On Duty", color: "#B08B3D" },
  absent: { label: "Absent", color: "#A33636" },
  cancelled: { label: "Cancelled", color: "#8A8372" },
};

const STORAGE_KEY = "anubhav-attendance-v1";

function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtMonthYear(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
}

const COURSES = Array.from(new Set(SESSIONS.map((s) => s.subject)));
const PROF_BY_COURSE = COURSES.reduce((acc, c) => {
  const s = SESSIONS.find((x) => x.subject === c);
  acc[c] = s ? s.professor : "";
  return acc;
}, {});

function AttendanceRegister() {
  const [attendance, setAttendance] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  });
  const [view, setView] = useState("overview");
  const [courseFilter, setCourseFilter] = useState("all");
  const [openMonths, setOpenMonths] = useState({});
  const [showResetConfirm, setShowResetConfirm] = useState(false);

  const persist = useCallback((next) => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
  }, []);

  const mark = (id, status) => {
    setAttendance((prev) => {
      const next = { ...prev };
      if (next[id] === status) delete next[id];
      else next[id] = status;
      persist(next);
      return next;
    });
  };

  const resetAll = () => { setAttendance({}); persist({}); setShowResetConfirm(false); };

  const today = todayStr();

  const courseStats = useMemo(() => {
    const stats = {};
    COURSES.forEach((c) => {
      const sessions = SESSIONS.filter((s) => s.subject === c);
      let present = 0, od = 0, absent = 0, cancelled = 0, unmarkedPast = 0;
      sessions.forEach((s) => {
        const st = attendance[s.id];
        if (st === "present") present++;
        else if (st === "od") od++;
        else if (st === "absent") absent++;
        else if (st === "cancelled") cancelled++;
        else if (s.date < today) unmarkedPast++;
      });
      const held = present + od + absent;
      const pct = held > 0 ? ((present + od) / held) * 100 : null;
      stats[c] = { total: sessions.length, present, od, absent, cancelled, unmarkedPast, held, pct };
    });
    return stats;
  }, [attendance, today]);

  const overall = useMemo(() => {
    let present = 0, od = 0, absent = 0, unmarkedPast = 0, total = SESSIONS.length;
    SESSIONS.forEach((s) => {
      const st = attendance[s.id];
      if (st === "present") present++;
      else if (st === "od") od++;
      else if (st === "absent") absent++;
      else if (!st && s.date < today) unmarkedPast++;
    });
    const held = present + od + absent;
    const pct = held > 0 ? ((present + od) / held) * 100 : null;
    return { present, od, absent, held, pct, total, unmarkedPast };
  }, [attendance, today]);

  const sessionsByMonth = useMemo(() => {
    const filtered = courseFilter === "all" ? SESSIONS : SESSIONS.filter((s) => s.subject === courseFilter);
    const groups = {};
    filtered.forEach((s) => {
      const key = s.date.slice(0, 7);
      if (!groups[key]) groups[key] = [];
      groups[key].push(s);
    });
    return Object.entries(groups).sort(([a], [b]) => a.localeCompare(b));
  }, [courseFilter]);

  useEffect(() => {
    const key = today.slice(0, 7);
    setOpenMonths((prev) => (Object.keys(prev).length ? prev : { [key]: true }));
  }, [today]);

  const toggleMonth = (key) => setOpenMonths((prev) => ({ ...prev, [key]: !prev[key] }));

  const seal = (pct, size = 88) => {
    if (pct === null) {
      return (
        <div style={{ width: size, height: size, borderRadius: "50%", border: "2px dashed #B7AD90", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "#8A8372", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textAlign: "center", lineHeight: 1.2 }}>NO<br/>DATA</div>
      );
    }
    const color = pct >= STUDENT.threshold ? "#3F6B4C" : "#A33636";
    return (
      <div style={{ width: size, height: size, borderRadius: "50%", border: `3px solid ${color}`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0, transform: "rotate(-6deg)", position: "relative", color, boxShadow: `inset 0 0 0 3px ${color}22` }}>
        <div style={{ position: "absolute", inset: 4, borderRadius: "50%", border: `1px solid ${color}55` }} />
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: size > 70 ? 22 : 16 }}>{Math.round(pct)}%</span>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 8, letterSpacing: "0.08em", marginTop: 2 }}>ATTEND</span>
      </div>
    );
  };

  return (
    <div style={{ background: "#F2ECDD", minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif", color: "#26241E", padding: "0 0 40px 0" }}>
      <style>{`
        * { box-sizing: border-box; }
        .att-btn { transition: transform 0.12s ease, box-shadow 0.12s ease; cursor: pointer; }
        .att-btn:hover { transform: translateY(-1px); }
        .att-btn:active { transform: translateY(0); }
        .course-chip { transition: all 0.15s ease; cursor: pointer; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #C9C0A8; border-radius: 3px; }
      `}</style>

      <div style={{ borderBottom: "3px double #7A2E2E", padding: "28px 20px 20px", background: "linear-gradient(180deg, #F7F2E4 0%, #F2ECDD 100%)" }}>
        <div style={{ maxWidth: 880, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
            <ScrollText size={20} color="#7A2E2E" />
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.15em", color: "#7A2E2E", fontWeight: 600 }}>
              REGISTER No. {STUDENT.reg}
            </span>
          </div>
          <h1 style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 700, fontSize: "clamp(28px, 5vw, 40px)", margin: 0, color: "#26241E", letterSpacing: "-0.01em" }}>
            Attendance Register
          </h1>
          <p style={{ margin: "6px 0 0", fontSize: 14, color: "#5B5644" }}>
            {STUDENT.name} &nbsp;·&nbsp; {STUDENT.program} &nbsp;·&nbsp; {fmtDate(SESSIONS[0].date)} – {fmtDate(SESSIONS[SESSIONS.length - 1].date)}
          </p>
        </div>
      </div>

      <div style={{ maxWidth: 880, margin: "0 auto", padding: "0 20px" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "center", background: "#FFFDF6", border: "1px solid #E1D8BC", borderRadius: 10, padding: "16px 20px", margin: "20px 0", boxShadow: "0 1px 2px rgba(0,0,0,0.03)" }}>
          {seal(overall.pct, 72)}
          <div style={{ flex: 1, minWidth: 180 }}>
            <div style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: "0.08em", color: "#8A8372", marginBottom: 4 }}>Overall standing</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }}>
              {overall.present} present · {overall.od} OD · {overall.absent} absent · {overall.held} of {overall.total} classes held so far
            </div>
            {overall.unmarkedPast > 0 && (
              <div style={{ fontSize: 12.5, color: "#A33636", marginTop: 4 }}>{overall.unmarkedPast} past class{overall.unmarkedPast > 1 ? "es" : ""} still need marking</div>
            )}
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
          {[["overview", "Course Overview", GraduationCap], ["register", "Full Register", ScrollText]].map(([key, label, IconComp]) => (
            <button key={key} onClick={() => setView(key)} className="att-btn" style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", borderRadius: 8, border: "1px solid", borderColor: view === key ? "#7A2E2E" : "#D8CFB2", background: view === key ? "#7A2E2E" : "#FFFDF6", color: view === key ? "#F7F2E4" : "#5B5644", fontSize: 13.5, fontWeight: 600, fontFamily: "'IBM Plex Sans', sans-serif" }}>
              <IconComp size={15} /> {label}
            </button>
          ))}
          <button onClick={() => setShowResetConfirm(true)} className="att-btn" style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, padding: "9px 14px", borderRadius: 8, border: "1px solid #D8CFB2", background: "#FFFDF6", color: "#8A8372", fontSize: 13 }}>
            <RotateCcw size={14} /> Reset
          </button>
        </div>

        {showResetConfirm && (
          <div style={{ background: "#FBEFE9", border: "1px solid #E3B8AC", borderRadius: 8, padding: "14px 16px", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
            <span style={{ fontSize: 13.5, color: "#7A2E2E" }}>Clear every marked attendance record? This can't be undone.</span>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={resetAll} className="att-btn" style={{ padding: "6px 14px", borderRadius: 6, border: "none", background: "#A33636", color: "#fff", fontSize: 13, fontWeight: 600 }}>Yes, clear all</button>
              <button onClick={() => setShowResetConfirm(false)} className="att-btn" style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid #D8CFB2", background: "#FFFDF6", fontSize: 13 }}>Cancel</button>
            </div>
          </div>
        )}

        {view === "overview" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 14, marginBottom: 20 }}>
            {COURSES.map((c) => {
              const s = courseStats[c];
              return (
                <div key={c} style={{ background: "#FFFDF6", border: "1px solid #E1D8BC", borderRadius: 12, padding: 16, display: "flex", gap: 14, alignItems: "flex-start" }}>
                  {seal(s.pct, 64)}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 600, fontSize: 15, lineHeight: 1.3, marginBottom: 3 }}>{c}</div>
                    <div style={{ fontSize: 12, color: "#8A8372", marginBottom: 8 }}>{PROF_BY_COURSE[c]}</div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#5B5644" }}>
                      {s.present}P{s.od ? ` · ${s.od}OD` : ""} · {s.absent}A{s.cancelled ? ` · ${s.cancelled}C` : ""} &nbsp;/&nbsp; {s.total} total
                    </div>
                    {s.unmarkedPast > 0 && <div style={{ fontSize: 11.5, color: "#A33636", marginTop: 4 }}>{s.unmarkedPast} unmarked</div>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {view === "register" && (
          <>
            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 14 }}>
              <button onClick={() => setCourseFilter("all")} className="course-chip" style={{ padding: "6px 13px", borderRadius: 20, border: "1px solid", borderColor: courseFilter === "all" ? "#7A2E2E" : "#D8CFB2", background: courseFilter === "all" ? "#7A2E2E" : "#FFFDF6", color: courseFilter === "all" ? "#F7F2E4" : "#5B5644", fontSize: 12.5, whiteSpace: "nowrap", fontWeight: 600 }}>All courses</button>
              {COURSES.map((c) => (
                <button key={c} onClick={() => setCourseFilter(c)} className="course-chip" style={{ padding: "6px 13px", borderRadius: 20, border: "1px solid", borderColor: courseFilter === c ? "#7A2E2E" : "#D8CFB2", background: courseFilter === c ? "#7A2E2E" : "#FFFDF6", color: courseFilter === c ? "#F7F2E4" : "#5B5644", fontSize: 12.5, whiteSpace: "nowrap", fontWeight: 600 }}>{c}</button>
              ))}
            </div>

            {sessionsByMonth.map(([monthKey, sess]) => {
              const isOpen = !!openMonths[monthKey];
              return (
                <div key={monthKey} style={{ marginBottom: 12, border: "1px solid #E1D8BC", borderRadius: 10, background: "#FFFDF6", overflow: "hidden" }}>
                  <button onClick={() => toggleMonth(monthKey)} className="att-btn" style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", background: "transparent", border: "none", textAlign: "left" }}>
                    <span style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 600, fontSize: 15 }}>{fmtMonthYear(sess[0].date)}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8, color: "#8A8372", fontSize: 12 }}>
                      {sess.length} session{sess.length > 1 ? "s" : ""} {isOpen ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                    </span>
                  </button>
                  {isOpen && (
                    <div style={{ borderTop: "1px solid #EDE6D0" }}>
                      {sess.map((s) => {
                        const st = attendance[s.id];
                        const isToday = s.date === today;
                        return (
                          <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 16px", borderBottom: "1px solid #F1EBD8", background: isToday ? "#FBF3DF" : "transparent" }}>
                            <div style={{ width: 92, flexShrink: 0 }}>
                              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, fontWeight: 600 }}>{fmtDate(s.date)}</div>
                              <div style={{ fontSize: 10.5, color: "#8A8372" }}>{s.day.slice(0, 3)} · {s.slot}</div>
                            </div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontSize: 13.5, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.subject}</div>
                              <div style={{ fontSize: 11.5, color: "#8A8372" }}>{s.professor}</div>
                            </div>
                            <div style={{ display: "flex", gap: 4, flexShrink: 0, flexWrap: "wrap", justifyContent: "flex-end", maxWidth: 132 }}>
                              {["present", "od", "absent", "cancelled"].map((opt) => {
                                const meta = STATUS_META[opt];
                                const active = st === opt;
                                const IconComp = opt === "present" ? Check : opt === "od" ? FileCheck : opt === "absent" ? X : Ban;
                                return (
                                  <button key={opt} onClick={() => mark(s.id, opt)} className="att-btn" title={meta.label} style={{ width: 28, height: 28, borderRadius: 7, border: `1.5px solid ${active ? meta.color : "#D8CFB2"}`, background: active ? meta.color : "#FFFDF6", color: active ? "#fff" : "#8A8372", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                    <IconComp size={13} />
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}

        <div style={{ display: "flex", justifyContent: "center", gap: 16, flexWrap: "wrap", marginTop: 24, fontSize: 11.5, color: "#8A8372" }}>
          {["present", "od", "absent", "cancelled"].map((opt) => {
            const meta = STATUS_META[opt];
            const IconComp = opt === "present" ? Check : opt === "od" ? FileCheck : opt === "absent" ? X : Ban;
            return (
              <span key={opt} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <IconComp size={12} color={meta.color} /> {meta.label}
              </span>
            );
          })}
        </div>
        <div style={{ textAlign: "center", fontSize: 11.5, color: "#B7AD90", marginTop: 10, fontFamily: "'IBM Plex Mono', monospace" }}>
          {STUDENT.threshold}% minimum attendance · On Duty counts as present · marks saved automatically on this device
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AttendanceRegister />);
</script>
</body>
</html>
