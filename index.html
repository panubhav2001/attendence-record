function iconScroll(s, c) { return svg(s, c, '<path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M15 8h-5"/><path d="M15 12h-5"/>'); }
function iconChevDown(s, c) { return svg(s, c, '<polyline points="6 9 12 15 18 9"/>'); }
function iconChevUp(s, c) { return svg(s, c, '<polyline points="18 15 12 9 6 15"/>'); }
function iconReset(s, c) { return svg(s, c, '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'); }

function iconStar(s, c) { return svg(s, c, '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'); }

function esc(str) {
  var d = document.createElement("div");
  d.innerText = str;
  return d.innerHTML;
}

function todayStr() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function fmtDate(iso) {
  var d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtMonthYear(iso) {
  var d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
}

var COURSES = [];
(function () {
  var seen = {};
  SESSIONS.forEach(function (s) { if (!seen[s.subject]) { seen[s.subject] = true; COURSES.push(s.subject); } });
})();
var PROF_BY_COURSE = {};
COURSES.forEach(function (c) {
  var ps = [];
  SESSIONS.forEach(function (x) { if (x.subject === c && ps.indexOf(x.professor) < 0) ps.push(x.professor); });
  PROF_BY_COURSE[c] = ps.join(" & ");
});

/* ---------- state ---------- */
var state = {
  attendance: {},
  view: "overview",
  courseFilter: "all",
  openMonths: {},
  showResetConfirm: false
};

try {
  var raw = localStorage.getItem(STORAGE_KEY);
  if (raw) state.attendance = JSON.parse(raw);
} catch (e) {}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.attendance)); } catch (e) {}
}

function queueCloudSync() {
  syncStatus = "syncing";
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 700);
  renderSyncBadge();
}

function pushToCloud() {
  fetch(SYNC.base + SYNC.binId, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Access-Key": SYNC.accessKey },
    body: JSON.stringify({ attendance: state.attendance, updatedAt: new Date().toISOString() })
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        console.error("[sync] push failed:", res.status, body);
        var err = new Error("http_" + res.status);
        err.status = res.status;
        throw err;
      });
    }
    syncStatus = "synced";
    renderSyncBadge();
  }).catch(function (e) {
    console.error("[sync] push error:", e);
    if (e && (e.status === 401 || e.status === 403)) syncStatus = "auth_error";
    else if (e && e.status === 404) syncStatus = "not_found";
    else syncStatus = "error";
    renderSyncBadge();
  });
}

function pullFromCloud(showLoading) {
  if (showLoading) { syncStatus = "syncing"; renderSyncBadge(); }
  fetch(SYNC.base + SYNC.binId + "/latest", {
    headers: { "X-Access-Key": SYNC.accessKey }
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        console.error("[sync] pull failed:", res.status, body);
        var err = new Error("http_" + res.status);
        err.status = res.status;
        throw err;
      });
    }
    return res.json();
  }).then(function (data) {
    var record = data && data.record ? data.record : null;
    if (record && record.attendance) {
      state.attendance = record.attendance;
      persist();
      render();
    }
    syncStatus = "synced";
    renderSyncBadge();
  }).catch(function (e) {
    console.error("[sync] pull error:", e);
    if (e && (e.status === 401 || e.status === 403)) syncStatus = "auth_error";
    else if (e && e.status === 404) syncStatus = "not_found";
    else syncStatus = "offline";
    renderSyncBadge();
  });
}

function renderSyncBadge() {
  var el = document.getElementById("syncBadge");
  if (!el) return;
  var map = {
    idle:       { text: "\\u00b7", color: "#B7AD90" },
    syncing:    { text: "Syncing\\u2026", color: "#8A8372" },
    synced:     { text: "Synced", color: "#3F6B4C" },
    error:      { text: "Sync failed \\u2013 saved on this device", color: "#A33636" },
    offline:    { text: "Offline \\u2013 showing last saved copy", color: "#A33636" },
    auth_error: { text: "Sync key rejected \\u2013 check Access Key permissions", color: "#A33636" },
    not_found:  { text: "Bin not found \\u2013 check Bin ID", color: "#A33636" }
  };
  var m = map[syncStatus] || map.idle;
  el.textContent = m.text;
  el.style.color = m.color;
}

function mark(id, status) {
  if (state.attendance[id] === status) delete state.attendance[id];
  else state.attendance[id] = status;
  persist();
  render();
  queueCloudSync();
}

function resetAll() {
  state.attendance = {};
  persist();
  state.showResetConfirm = false;
  render();
  queueCloudSync();
}

/* ---------- derived stats ---------- */
function computeCourseStats(today) {
  var stats = {};
  COURSES.forEach(function (c) {
    var sessions = SESSIONS.filter(function (s) { return s.subject === c; });
    var present = 0, od = 0, absent = 0, cancelled = 0, unmarkedPast = 0;
    sessions.forEach(function (s) {
      var st = state.attendance[s.id];
      if (st === "present") present++;
      else if (st === "od") od++;
      else if (st === "absent") absent++;
      else if (st === "cancelled") cancelled++;
      else if (s.date < today) unmarkedPast++;
    });
    var held = present + od + absent;
    var pct = held > 0 ? ((present + od) / held) * 100 : null;
    stats[c] = { total: sessions.length, present: present, od: od, absent: absent, cancelled: cancelled, unmarkedPast: unmarkedPast, held: held, pct: pct };
  });
  return stats;
}

function computeOverall(today) {
  var present = 0, od = 0, absent = 0, unmarkedPast = 0, total = SESSIONS.length;
  SESSIONS.forEach(function (s) {
    var st = state.attendance[s.id];
    if (st === "present") present++;
    else if (st === "od") od++;
    else if (st === "absent") absent++;
    else if (!st && s.date < today) unmarkedPast++;
  });
  var held = present + od + absent;
  var pct = held > 0 ? ((present + od) / held) * 100 : null;
  return { present: present, od: od, absent: absent, held: held, pct: pct, total: total, unmarkedPast: unmarkedPast };
}

function groupByMonth(filterCourse) {
  var filtered = filterCourse === "all" ? SESSIONS : SESSIONS.filter(function (s) { return s.subject === filterCourse; });
  var groups = {}, order = [];
  filtered.forEach(function (s) {
    var key = s.date.slice(0, 7);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  order.sort();
  return order.map(function (k) { return [k, groups[k]]; });
}

/* ---------- render pieces ---------- */
function sealHtml(pct, size) {
  size = size || 88;
  if (pct === null) {
    return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;border:2px dashed #B7AD90;' +
      'display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#8A8372;' +
      'font-family:inherit;font-size:11px;text-align:center;line-height:1.2;" class="mono">NO<br>DATA</div>';
  }
  var color = pct >= STUDENT.threshold ? "#3F6B4C" : "#A33636";
  var fs = size > 70 ? 22 : 16;
  return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;border:3px solid ' + color +
    ';display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;' +
    'transform:rotate(-6deg);position:relative;color:' + color + ';box-shadow:inset 0 0 0 3px ' + color + '22;">' +
    '<div style="position:absolute;inset:4px;border-radius:50%;border:1px solid ' + color + '55;"></div>' +
    '<span class="mono" style="font-weight:700;font-size:' + fs + 'px;">' + Math.round(pct) + '%</span>' +
    '<span class="mono" style="font-size:8px;letter-spacing:0.08em;margin-top:2px;">ATTEND</span></div>';
}

function bunk(s) { return Math.floor((s.total - s.cancelled) * (100 - STUDENT.threshold) / 100 + 1e-9) - s.absent; }
function bunkHtml(s) {
  var b = bunk(s), txt, col;
  if (b < 0) { txt = "Can no longer reach " + STUDENT.threshold + "%"; col = "#A33636"; }
  else { txt = b + " skip" + (b === 1 ? "" : "s") + " left at " + STUDENT.threshold + "%"; col = b === 0 ? "#B08B3D" : "#3F6B4C"; }
  return '<div style="font-size:11.5px;color:' + col + ';margin-top:4px;">' + txt + '</div>';
}

function statsHtml(today, overall, cs) {
  function dd(iso) { return new Date(iso + "T00:00:00"); }
  function tile(label, big, sub, col) {
    return '<div style="background:#FFFDF6;border:1px solid #E1D8BC;border-radius:12px;padding:14px 16px;">' +
      '<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#8A8372;">' + label + '</div>' +
      '<div class="serif" style="font-size:26px;font-weight:700;margin:4px 0 2px;color:' + (col || "#26241E") + ';">' + big + '</div>' +
      '<div style="font-size:12px;color:#8A8372;">' + sub + '</div></div>';
  }
  function until(r) {
    var n = Math.round((dd(r[0]) - dd(today)) / 86400000);
    return n > 0 ? n + (n === 1 ? " day" : " days") : (today <= r[1] ? "On now" : "Done");
  }
  var run = 0, longest = 0;
  SESSIONS.forEach(function (s) {
    var x = state.attendance[s.id];
    if (x === "absent") run = 0;
    else if (x === "present" || x === "od") { run++; if (run > longest) longest = run; }
  });
  var attended = overall.present + overall.od;
  var left = SESSIONS.filter(function (s) { return s.date >= today && !state.attendance[s.id]; }).length;
  var elapsed = SESSIONS.filter(function (s) { return s.date < today; }).length;
  var skips = 0, perfect = 0;
  COURSES.forEach(function (c) { if (bunk(cs[c]) > 0) skips += bunk(cs[c]); if (cs[c].held > 0 && cs[c].absent === 0) perfect++; });
  var ranked = COURSES.filter(function (c) { return cs[c].held > 0; }).sort(function (a, b) { return cs[b].pct - cs[a].pct; });
  var top = ranked[0], low = ranked[ranked.length - 1];
  var perDay = {};
  SESSIONS.forEach(function (s) { perDay[s.date] = (perDay[s.date] || 0) + 1; });
  var md = Object.keys(perDay).sort(function (a, b) { return perDay[b] - perDay[a] || (a < b ? -1 : 1); })[0];
  var none = "Mark a few classes first";
  var h = '<div style="background:#FFFDF6;border:1px solid #E1D8BC;border-radius:12px;padding:14px 16px;margin-bottom:12px;">' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#8A8372;"><span>Term progress</span><span>' +
    elapsed + ' / ' + SESSIONS.length + ' classes gone by</span></div>' +
    '<div style="height:10px;background:#EDE6D0;border-radius:5px;margin-top:8px;overflow:hidden;"><div style="height:100%;width:' +
    Math.round(elapsed / SESSIONS.length * 100) + '%;background:#7A2E2E;"></div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px;">';
  h += tile("Current streak", run, "classes in a row \u00b7 best " + longest, run >= 5 ? "#3F6B4C" : null);
  h += tile("Hours in class", (attended * 1.5).toFixed(1) + "h", attended + " classes attended");
  h += tile("Skip budget left", skips, "across all courses at " + STUDENT.threshold + "%", skips === 0 ? "#A33636" : null);
  h += tile("Classes to go", left, (left * 1.5).toFixed(1) + " hours of lectures");
  h += tile("Marathon day", perDay[md] + " classes", fmtDate(md) + " \u00b7 " + new Date(md + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long" }));
  h += tile("Perfect courses", perfect, "zero absences so far", perfect > 0 ? "#3F6B4C" : null);
  h += tile("Star course", top ? Math.round(cs[top].pct) + "%" : "\u2014", top ? esc(top) : none, "#3F6B4C");
  h += tile("Needs some love", low ? Math.round(cs[low].pct) + "%" : "\u2014", low ? esc(low) : none, low && cs[low].pct < STUDENT.threshold ? "#A33636" : null);
  h += tile("Mid sems in", until(EXAMS.mid), fmtDate(EXAMS.mid[0]) + " \u2013 " + fmtDate(EXAMS.mid[1]));
  h += tile("End sems in", until(EXAMS.end), fmtDate(EXAMS.end[0]) + " \u2013 " + fmtDate(EXAMS.end[1]));
  return h + '</div>';
}

      ';color:' + (active ? "#F7F2E4" : "#5B5644") + ';font-size:13.5px;font-weight:600;">' + t[2](15, active ? "#F7F2E4" : "#5B5644") + ' ' + t[1] + '</button>';

    'border:1px solid #D8CFB2;background:#FFFDF6;color:#8A8372;font-size:13px;">' + iconReset(14, "#8A8372") + ' Reset</button>';
  html += '</div>';

  if (state.showResetConfirm) {
    html += '<div style="background:#FBEFE9;border:1px solid #E3B8AC;border-radius:8px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">';
    html += '<span style="font-size:13.5px;color:#7A2E2E;">Clear every marked attendance record? This can\'t be undone.</span>';

    html += '<button class="att-btn" id="cancelResetBtn" style="padding:6px 14px;border-radius:6px;border:1px solid #D8CFB2;background:#FFFDF6;font-size:13px;">Cancel</button>';

    var allActive = state.courseFilter === "all";

    });
    html += '</div>';

    var groups = groupByMonth(state.courseFilter);

      html += '<span class="serif" style="font-weight:600;font-size:15px;">' + fmtMonthYear(sess[0].date) + '</span>';
      html += '<span style="display:flex;align-items:center;gap:8px;color:#8A8372;font-size:12px;">' + sess.length + ' session' + (sess.length > 1 ? "s" : "") + ' ' +
        (isOpen ? iconChevUp(16, "#8A8372") : iconChevDown(16, "#8A8372")) + '</span>';
      html += '</button>';
      if (isOpen) {
        html += '<div style="border-top:1px solid #EDE6D0;">';
        sess.forEach(function (s) {
          var st = state.attendance[s.id];
          var isToday = s.date === today;
          html += '<div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #F1EBD8;background:' + (isToday ? "#FBF3DF" : "transparent") + ';">';
          html += '<div style="width:92px;flex-shrink:0;"><div class="mono" style="font-size:12.5px;font-weight:600;">' + fmtDate(s.date) + '</div>' +
            '<div style="font-size:10.5px;color:#8A8372;">' + s.day.slice(0, 3) + ' \u00b7 ' + s.slot + '</div></div>';
          html += '<div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(s.subject) + ' <span class="mono" style="font-size:11px;color:#8A8372;">#' + s.n + '</span></div>' +
            '<div style="font-size:11.5px;color:#8A8372;">' + esc(s.professor) + '</div></div>';
          html += '<div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:132px;">';
          STATUS_ORDER.forEach(function (opt) {
            var meta = STATUS_META[opt];
            var active = st === opt;
            html += '<button class="att-btn mark-btn" data-id="' + s.id + '" data-status="' + opt + '" title="' + meta.label + '" style="width:28px;height:28px;border-radius:7px;' +
              'border:1.5px solid ' + (active ? meta.color : "#D8CFB2") + ';background:' + (active ? meta.color : "#FFFDF6") +
              ';display:flex;align-items:center;justify-content:center;">' + meta.glyph(13, active ? "#fff" : "#8A8372") + '</button>';
          });
          html += '</div></div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
  }

  if (state.view === "stats") html += statsHtml(today, overall, courseStats);

  // legend + footer
  html += '<div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:11.5px;color:#8A8372;">';
  STATUS_ORDER.forEach(function (opt) {
    var meta = STATUS_META[opt];
    html += '<span style="display:flex;align-items:center;gap:5px;">' + meta.glyph(12, meta.color) + ' ' + meta.label + '</span>';
  });
  html += '</div>';
  html += '<div class="mono" style="text-align:center;font-size:11.5px;color:#B7AD90;margin-top:10px;">' +
    STUDENT.threshold + '% minimum attendance \u00b7 On Duty counts as present \u00b7 marks saved automatically on this device</div>';

  html += '</div>'; // max-width wrapper

  document.getElementById("root").innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  var root = document.getElementById("root");
  root.querySelectorAll("[data-view]").forEach(function (btn) {
    btn.addEventListener("click", function () { state.view = btn.getAttribute("data-view"); render(); });
  });
  var resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", function () { state.showResetConfirm = true; render(); });
  var refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.addEventListener("click", function () { pullFromCloud(true); });
  renderSyncBadge();
  var confirmResetBtn = document.getElementById("confirmResetBtn");
  if (confirmResetBtn) confirmResetBtn.addEventListener("click", resetAll);
  var cancelResetBtn = document.getElementById("cancelResetBtn");
  if (cancelResetBtn) cancelResetBtn.addEventListener("click", function () { state.showResetConfirm = false; render(); });
  root.querySelectorAll(".course-chip").forEach(function (btn) {
    btn.addEventListener("click", function () { state.courseFilter = btn.getAttribute("data-course"); render(); });
  });
  root.querySelectorAll(".month-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var k = btn.getAttribute("data-month");
      state.openMonths[k] = !state.openMonths[k];
      render();
    });
  });
  root.querySelectorAll(".mark-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      mark(btn.getAttribute("data-id"), btn.getAttribute("data-status"));
    });
  });
}

// default-open current month
state.openMonths[todayStr().slice(0, 7)] = true;

render(); // fast paint from local cache
pullFromCloud(true); // then reconcile with the cloud copy

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") pullFromCloud(false);
});
window.addEventListener("focus", function () { pullFromCloud(false); });
})();
</script>
</body>
</html>
